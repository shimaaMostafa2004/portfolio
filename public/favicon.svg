<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Sleek outer server grid layout -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#090514" stroke="#6366f1" stroke-width="5" />
  
  <!-- Subtle circular grid -->
  <circle cx="60" cy="60" r="35" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="60" cy="60" r="22" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5" />

  <!-- Connecting technical channels -->
  <path d="M60 15 L60 105 M15 60 L105 60" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M30 30 L90 90 M30 90 L90 30" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Core Database main hubs -->
  <circle cx="60" cy="60" r="14" fill="url(#nodeGlow)" />
  <circle cx="60" cy="60" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Peripheral connected server nodules -->
  <circle cx="60" cy="20" r="5" fill="#6366f1" />
  <circle cx="60" cy="100" r="5" fill="#6366f1" />
  <circle cx="20" cy="60" r="5" fill="#6366f1" />
  <circle cx="100" cy="60" r="5" fill="#6366f1" />

  <circle cx="32" cy="32" r="4" fill="#ec4899" />
  <circle cx="88" cy="88" r="4" fill="#ec4899" />
  <circle cx="32" cy="88" r="4" fill="#ec4899" />
  <circle cx="88" cy="32" r="4" fill="#ec4899" />
</svg>
